{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clipboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clipboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLIPBOARD_PASSWORDS: {{ required "config.passwords is required (or set existingSecret); without it the app falls back to the password 1234" .Values.config.passwords | quote }}
  {{- with .Values.config.mongodbUri }}
  MONGODB_URI: {{ . | quote }}
  {{- end }}
{{- end }}
