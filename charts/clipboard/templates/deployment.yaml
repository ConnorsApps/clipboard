{{- include "clipboard.rejectHullValues" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clipboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clipboard.labels" . | nindent 4 }}
spec:
  # Single replica: tokens and WebSockets are per-process, the PVC is RWO.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "clipboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clipboard.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the chart's Secret changes.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clipboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ include "clipboard.secretName" . }}
          env:
            - name: FILES_DIR
              value: /data
            - name: PORT
              value: "8080"
            {{- with .Values.config.tokenExpiry }}
            - name: TOKEN_EXPIRY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # No health endpoint; check the port.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: files
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: files
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "clipboard.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
